appId: com.promptforge.ai
productName: PromptForge AI
copyright: Copyright © 2026 PromptForge

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - "!out/**/*.map"

extraResources:
  - from: templates
    to: templates
  - from: migrations
    to: migrations

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: PromptForge AI

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Utility

publish:
  provider: github
  owner: IrfanCodesBTW
  repo: PromptForge-AI
